# Download-count badges that count people, not update checks.
#
# GitHub's own total (and shields.io's github/downloads badge) adds up every
# file on a release, and both apps fetch a small file on each update check:
# Extra Cover reads latest.yml / beta.yml, Pack Studio reads update.json. That
# total therefore mostly counts launches. This counts only the Extra Cover
# installer and the Pack Studio ZIP (the same rule as tools/stats.js in the
# source repo: keep the two in step) and writes shields.io endpoint files to
# the `badges` branch, which the README's badges read. It also writes an
# all-files badge and assets.json (every file on every release with its count,
# feeds and update checks included), so nothing GitHub tracks is left out.
#
# `badges` is an orphan branch, force-pushed with one commit each run, so it
# never grows a history and never touches main.
name: Download counts

on:
  schedule:
    - cron: '17 */6 * * *'
  release:
    types: [published, edited]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: download-counts
  cancel-in-progress: false

jobs:
  count:
    runs-on: ubuntu-latest
    steps:
      - name: Count installer and Pack Studio downloads
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh api --paginate "repos/$REPO/releases?per_page=100" \
            --jq '.[] | select(.draft | not) | .tag_name as $t | .assets[] | [$t, .name, .download_count] | @tsv' > counts.tsv
          mkdir out
          node - <<'JS'
          const fs = require('fs');
          const t = { extraCover: 0, packStudio: 0, allFiles: 0 };
          const files = [];
          for (const line of fs.readFileSync('counts.tsv', 'utf8').split('\n')) {
            const [release, name, n] = line.split('\t');
            if (!name) continue;
            files.push({ release, file: name, downloads: Number(n) || 0 });
            t.allFiles += Number(n) || 0;
            if (/^extra-cover-Setup-.*\.exe$/i.test(name)) t.extraCover += Number(n) || 0;
            else if (/^packstudio-win-x64\.zip$/i.test(name)) t.packStudio += Number(n) || 0;
          }
          const fmt = (n) => n < 1000 ? String(n)
            : n < 1e6 ? `${(n / 1e3).toFixed(n < 1e4 ? 1 : 0).replace(/\.0$/, '')}k`
            : `${(n / 1e6).toFixed(1).replace(/\.0$/, '')}M`;
          const badge = (file, label, n, color) => fs.writeFileSync(`out/${file}`,
            JSON.stringify({ schemaVersion: 1, label, message: fmt(n), color }) + '\n');
          badge('downloads.json', 'downloads', t.extraCover + t.packStudio, '2EA44F');
          badge('extra-cover.json', 'Extra Cover downloads', t.extraCover, '4A8BF5');
          badge('pack-studio.json', 'Pack Studio downloads', t.packStudio, '6BA4FF');
          badge('all-files.json', 'all file downloads', t.allFiles, '555555');
          // Every file on every release, update-check files included.
          fs.writeFileSync('out/assets.json',
            JSON.stringify({ updated: new Date().toISOString(), totals: t, files }, null, 2) + '\n');
          console.log(t);
          JS

      - name: Publish to the badges branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        working-directory: out
        run: |
          git init -q -b badges
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="github-actions[bot]@users.noreply.github.com" commit -q -m "Download counts"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" badges
